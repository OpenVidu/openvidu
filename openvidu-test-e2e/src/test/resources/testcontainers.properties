# Safety net for any image that Testcontainers still has to pull itself (its own
# helpers such as Ryuk, or one that no DockerImages.await() covers). The defaults,
# an abort after 30 s without progress and a failure after 2 minutes, are too tight
# for runners in slow networks.
# Seconds without progress before a pull attempt is aborted and retried
pull.pause.timeout=300
# Seconds before Testcontainers gives up on an image
pull.timeout=1800
