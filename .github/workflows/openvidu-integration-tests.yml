name: OpenVidu integration tests
on:
  push:
    branches:
      - master
    paths:
      - "openvidu-test-integration/**"
      - ".github/workflows/openvidu-integration-tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "openvidu-test-integration/**"
      - ".github/workflows/openvidu-integration-tests.yml"
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration tests
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Configure OpenVidu Local Deployment
        uses: OpenVidu/actions/start-openvidu-local-deployment@ccd21721ffb48bdeb889526d3a0b496c451ffd48 # v1.0.24
        with:
          ref-openvidu-local-deployment: development
          # Batches every second and a reconciler run every 10 s, instead of 10 s and 60 s.
          pre_startup_commands: |
            yq e -i '.openvidu.analytics.interval = "1s" | .openvidu.analytics.reconciler.interval = "10s"' livekit.yaml
      - name: Install LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash

      - name: Checkout current repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: openvidu

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@ccd21721ffb48bdeb889526d3a0b496c451ffd48 # v1.0.24

      - name: Install dependencies
        working-directory: ./openvidu/openvidu-test-integration
        run: npm ci

      - name: Run tests
        working-directory: ./openvidu/openvidu-test-integration
        run: npm run test:ci

      - name: Upload report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: openvidu-integration-tests-report
          path: |
            ./openvidu/openvidu-test-integration/test-results.json
            ./openvidu/openvidu-test-integration/logs/
          retention-days: 7
      - name: Cleanup
        if: always()
        uses: OpenVidu/actions/cleanup@ccd21721ffb48bdeb889526d3a0b496c451ffd48 # v1.0.24

