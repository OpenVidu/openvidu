<h1 class="ovd-page-title">Rooms</h1>

<ovd-tile-row class="tiles" role="region" aria-label="Summary">
	<ovd-kpi-tile label="Active now" [value]="tile(summary()?.activeRooms)" [loading]="summary() === null" />
	<ovd-kpi-tile
		label="Participants active now"
		[value]="tile(summary()?.activeParticipants)"
		[loading]="summary() === null"
	/>
	<ovd-kpi-tile
		label="Rooms in range"
		[value]="tile(summary()?.roomsInRange)"
		[loading]="summary() === null"
		[approximate]="approximate()"
	/>
	<ovd-kpi-tile
		label="Sessions in range"
		[info]="infoTexts.participantSessions"
		[value]="tile(summary()?.participantSessions)"
		[loading]="summary() === null"
		[approximate]="approximate()"
	/>
</ovd-tile-row>

<div class="ovd-filter-bar">
	<div class="ovd-filter-slot">
		<mat-button-toggle-group
			aria-label="Status"
			hideSingleSelectionIndicator
			[value]="status()"
			(change)="setStatus($event.value)"
		>
			<mat-button-toggle value="active">Active</mat-button-toggle>
			<mat-button-toggle value="closed">Closed</mat-button-toggle>
			<mat-button-toggle value="all">All</mat-button-toggle>
		</mat-button-toggle-group>
	</div>

	<ovd-list-search label="Room name or SID" entity="room" />

	@if (nodeFilter()) {
		@if (nodeSelect(); as select) {
			<ng-container *ngComponentOutlet="select" />
		}
	}

	<div class="ovd-filter-slot">
		<mat-chip-listbox
			aria-label="Features"
			multiple
			[value]="selectedFeatures()"
			(change)="setFeatures($event.value)"
		>
			@for (feature of features; track feature.key) {
				<mat-chip-option [value]="feature.key">{{ feature.label }}</mat-chip-option>
			}
		</mat-chip-listbox>
	</div>
</div>

<ovd-rooms-table
	tableId="rooms"
	[columns]="columns()"
	[rows]="rows()"
	[sort]="sort()"
	[order]="order()"
	[loading]="loading()"
	[error]="error()"
	[pageSize]="limit()"
	[exportCsv]="exportCsv"
	[rangeMs]="rangeMs()"
	(sortChange)="setSort($event)"
	(retry)="retry()"
>
	@if (exactId(); as sid) {
		<ovd-empty-state ovdTableEmpty [heading]="'Room ' + sid + ' was not found'">
			<button matButton="outlined" type="button" ovdEmptyAction (click)="clearSearch()">Clear search</button>
		</ovd-empty-state>
	} @else {
		<ovd-empty-state ovdTableEmpty heading="No rooms match" hint="Change the filters or widen the time range.">
			<button matButton="outlined" type="button" ovdEmptyAction (click)="clearFilters()">Clear filters</button>
			<button matButton="outlined" type="button" ovdEmptyAction (click)="widenRange()">Widen range</button>
		</ovd-empty-state>
	}
</ovd-rooms-table>

<ovd-cursor-paginator
	[limit]="limit()"
	[nextCursor]="page()?.nextCursor ?? null"
	[prevCursor]="page()?.prevCursor ?? null"
	[total]="page()?.total"
	[rowCount]="rows().length"
/>
