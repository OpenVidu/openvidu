<h1 class="ovd-page-title">Agents</h1>

@if (noticeOpen()) {
	<ovd-notice class="notice" dismissible (dismiss)="dismissNotice()">
		<span>
			Agents are shown as participant sessions of kind AGENT; no agent telemetry (jobs, dispatch, tool calls) is
			collected.
		</span>
		<a routerLink="/participants" [queryParams]="participantsLink()">See them among the participants</a>
	</ovd-notice>
}

<ovd-tile-row class="tiles" role="region" aria-label="Agents summary">
	<ovd-kpi-tile label="Agents now" [value]="counter()" />
	<ovd-kpi-tile
		label="Agent sessions in range"
		[value]="sessionsTile()"
		[loading]="summary() === null"
		[approximate]="approximate()"
	/>
</ovd-tile-row>

<div class="ovd-filter-bar">
	<ovd-list-search label="Identity or SID" entity="participant" />

	<mat-form-field class="status" subscriptSizing="dynamic">
		<mat-label>Status</mat-label>
		<mat-select [value]="sessions.status()" (selectionChange)="sessions.setStatus($event.value)">
			<mat-option [value]="null">All</mat-option>
			@for (status of statuses; track status) {
				<mat-option [value]="status">{{ statusLabels[status] }}</mat-option>
			}
		</mat-select>
	</mat-form-field>

	@if (sessions.room(); as room) {
		<div class="ovd-filter-slot"><ovd-room-chip [sid]="room" /></div>
	}
</div>

<ovd-participant-sessions-table
	tableId="agents"
	caption="Agents"
	noun="agents"
	[columns]="sessions.columns()"
	[rows]="rows()"
	[sort]="sessions.sort()"
	[order]="sessions.order()"
	[loading]="loading()"
	[error]="error()"
	[pageSize]="limit()"
	[exactId]="sessions.exactId()"
	[time]="sessions.time"
	(sortChange)="sessions.setSort($event)"
	(retry)="retry()"
	(clearSearch)="sessions.clearSearch()"
	(clearFilters)="clearFilters()"
	(widenRange)="sessions.widenRange()"
/>

<ovd-cursor-paginator
	[limit]="limit()"
	[nextCursor]="page()?.nextCursor ?? null"
	[prevCursor]="page()?.prevCursor ?? null"
	[total]="page()?.total"
	[rowCount]="rows().length"
/>
