<h1 class="ovd-page-title">Participants</h1>

<ovd-tile-row class="tiles" role="region" aria-label="Summary">
	<ovd-kpi-tile label="Active now" [value]="tile(summary()?.active?.participants)" [loading]="summary() === null" />
	<ovd-kpi-tile
		label="Sessions in range"
		[info]="infoTexts.participantSessions"
		[value]="tile(summary()?.sessions?.participants)"
		[loading]="summary() === null"
		[approximate]="approximate()"
	/>
	<ovd-kpi-tile
		label="Services now"
		[info]="infoTexts.services"
		[value]="tile(summary()?.active?.services)"
		[hint]="servicesHint() ?? undefined"
		[loading]="summary() === null"
	/>
</ovd-tile-row>

<div class="ovd-filter-bar">
	<ovd-list-search label="Identity or SID" entity="participant" />

	<mat-form-field class="kind" subscriptSizing="dynamic" floatLabel="always">
		<mat-label>Kind</mat-label>
		<mat-select
			multiple
			placeholder="All kinds"
			[value]="selectedKinds()"
			(selectionChange)="setKinds($event.value)"
		>
			@for (kind of kinds; track kind) {
				<mat-option [value]="kind">{{ kindLabels[kind] }}</mat-option>
			}
		</mat-select>
	</mat-form-field>

	<mat-form-field class="status" subscriptSizing="dynamic">
		<mat-label>Status</mat-label>
		<mat-select [value]="sessions.status()" (selectionChange)="sessions.setStatus($event.value)">
			<mat-option [value]="null">All</mat-option>
			@for (status of statuses; track status) {
				<mat-option [value]="status">{{ statusLabels[status] }}</mat-option>
			}
		</mat-select>
	</mat-form-field>

	@if (sessions.room(); as room) {
		<div class="ovd-filter-slot"><ovd-room-chip [sid]="room" /></div>
	}
	@if (publisher()) {
		<div class="ovd-filter-slot">
			<mat-chip class="publisher-chip" (removed)="removePublisher()">
				Publishers
				<button matChipRemove type="button" aria-label="Remove the publishers filter">
					<mat-icon svgIcon="close" />
				</button>
			</mat-chip>
		</div>
	}
</div>

<ovd-participant-sessions-table
	tableId="participants"
	caption="Participants"
	noun="participants"
	[columns]="sessions.columns()"
	[rows]="rows()"
	[sort]="sessions.sort()"
	[order]="sessions.order()"
	[loading]="loading()"
	[error]="error()"
	[pageSize]="limit()"
	[exactId]="sessions.exactId()"
	[time]="sessions.time"
	(sortChange)="sessions.setSort($event)"
	(retry)="retry()"
	(clearSearch)="sessions.clearSearch()"
	(clearFilters)="clearFilters()"
	(widenRange)="sessions.widenRange()"
/>

<ovd-cursor-paginator
	[limit]="limit()"
	[nextCursor]="page()?.nextCursor ?? null"
	[prevCursor]="page()?.prevCursor ?? null"
	[total]="page()?.total"
	[rowCount]="rows().length"
/>
