  '@angular/build': 22.2.4
  '@angular/cdk': 22.2.4
  '@angular/cli': 22.2.4
  '@angular/common': 22.2.3
  '@angular/compiler': 22.2.3
  '@angular/compiler-cli': 22.2.3
  '@angular/core': 22.2.3
  '@angular/forms': 22.2.3
  '@angular/material': 22.2.4
  '@angular/material-date-fns-adapter': 22.2.4
  '@angular/platform-browser': 22.2.3
  '@angular/router': 22.2.3
  '@axe-core/playwright': 4.14.0
  '@date-fns/tz': 1.5.0
  '@eslint/js': 10.0.1
  '@fontsource-variable/inter': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@material-symbols/svg-400': 0.48.1
  '@playwright/test': 1.64.1
  '@fission-ai/openspec': 1.14.3
  '@types/cookie-parser': 1.4.10
  '@types/express': 5.0.6
  '@types/node': 24.19.2
  '@types/supertest': 7.2.1
  ajv: 8.20.0
  angular-eslint: 22.6.0
  bson: 7.3.3
  cookie-parser: 1.4.7
  date-fns: 4.4.0
  echarts: 6.1.0
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  express: 5.3.0
  express-rate-limit: 8.7.1
  globals: 17.13.0
  inversify: 8.2.3
  jose: 6.2.13
  jsdom: 30.1.3
  mongodb: 7.7.0
  ng-packagr: 22.2.5
  ngx-echarts: 22.0.0
  prettier: 3.9.10
  rxjs: 7.8.2
  supertest: 7.3.1
  testcontainers: 12.2.1
  tslib: 2.8.1
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vitest: 5.0.5
  winston: 3.19.0
  zod: 4.6.7
  zod-openapi: 6.0.2

# Install scripts stay disabled: esbuild (pulled in by tsx and the Angular CLI) runs from its platform package; ssh2
# and cpu-features (pulled in by testcontainers) only build optional native bindings and fall back to JavaScript; the
# protobufjs postinstall step is informational; @parcel/watcher, lmdb and msgpackr-extract (pulled in by the Angular
# CLI) load the prebuilt binaries of their platform packages.
allowBuilds:
  '@parcel/watcher': false
  cpu-features: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# Frozen installs (CI, Docker) trust the committed lockfile instead of re-applying minimumReleaseAge to
# every entry, which would otherwise fail builds for a day after any dependency bump.
trustLockfile: true
